name: Album overview
on:
  pull_request:
    paths:
      - 'apps/ios/**'
      - '.github/workflows/album-overview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  overview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/ios
    env:
      EXPO_NO_DOTENV: '1'
      CI: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/ios/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Check overview code
        run: npx eslint src/screens/life-album-manage-screen.tsx src/screens/life-album-manage-screen.test.tsx src/screens/album-contents-preview.tsx src/screens/album-contents-preview.test.tsx src/screens/settings-chrome.tsx src/screens/root-nav-band.tsx src/screens/leave-fab.tsx src/screens/life-page.ts --max-warnings 0
      - name: Check overview and electronic album flows
        run: npm test -- --runInBand --runTestsByPath src/screens/life-album-manage-screen.test.tsx src/screens/album-contents-preview.test.tsx src/screens/album-print-screen.test.tsx src/screens/album-epub-preview-screen.test.tsx src/infrastructure/album-epub-preview.test.ts src/screens/album-export-unlock.test.tsx src/i18n/i18n.test.ts src/screens/root-nav-band-layout.test.tsx src/screens/life-page.test.ts src/screens/navigation-band.test.tsx
