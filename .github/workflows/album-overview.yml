name: Album overview
on:
  pull_request:
    paths:
      - 'apps/ios/**'
      - '.github/workflows/album-overview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  overview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/ios
    env:
      EXPO_NO_DOTENV: '1'
      CI: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/ios/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Check overview code
        run: npx eslint src/screens/life-album-manage-screen.tsx src/screens/life-album-manage-screen.test.tsx src/screens/album-contents-preview.tsx src/screens/album-contents-preview.test.tsx src/screens/settings-chrome.tsx src/screens/root-nav-band.tsx src/screens/leave-fab.tsx src/screens/life-page.ts src/app/index.tsx src/screens/recent-moment.tsx src/screens/recent-editorial-photos.tsx src/screens/page-frame.ts src/screens/life-album-list-screen.tsx src/screens/family-directory-screen.tsx src/screens/life-album-manage-screen.tsx src/screens/family-albums-screen.tsx src/screens/life-album-new-screen.tsx src/screens/album-print-screen.tsx src/screens/family-epub-screen.tsx src/screens/life-album-preview-screen.tsx src/app/moment/[id].tsx src/screens/life-album-collect-sheet.tsx src/app/lookback/index.tsx src/screens/moment-images.tsx --max-warnings 0
      # Existing lifecycle dependency warnings predate this layout change; do not change effect behavior here.
      - name: Check layout changes in existing lifecycle screens
        run: npx eslint src/app/leave.tsx src/screens/family-screen.tsx src/screens/lookback-chrome.tsx --rule 'react-hooks/exhaustive-deps:off' --report-unused-disable-directives-severity off --max-warnings 0
      - name: Check overview and electronic album flows
        run: npm test -- --runInBand --runTestsByPath src/screens/life-album-manage-screen.test.tsx src/screens/album-contents-preview.test.tsx src/screens/album-print-screen.test.tsx src/screens/album-epub-preview-screen.test.tsx src/infrastructure/album-epub-preview.test.ts src/screens/album-export-unlock.test.tsx src/i18n/i18n.test.ts src/screens/root-nav-band-layout.test.tsx src/screens/life-page.test.ts src/screens/navigation-band.test.tsx src/screens/recent-editorial.test.tsx src/screens/recent-moment.test.tsx src/screens/recent-reading-hierarchy.test.tsx src/screens/recent-life-screen.test.tsx src/screens/moment-images.test.ts src/screens/page-frame.test.tsx src/screens/lookback-layout.test.ts src/screens/account-settings-pages.test.tsx src/screens/family-directory-screen.test.tsx src/screens/life-album-list-screen.test.tsx src/screens/moment-detail-layout-screen.test.tsx
